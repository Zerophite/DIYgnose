<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D5BB8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DIYgnose">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>DIYgnose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: garage app — sticky app bar with car switcher and view tabs; specs bench (diagram + list), DIY guides, parts & fluids. */
:root {
  --bg: #EDF0F2; --surface: #FFFFFF; --sunk: #F5F7F8; --ink: #15202A; --ink-2: #4E5C69; --line: #D2D9DF;
  --accent: #1D5BB8; --accent-ink: #FFFFFF; --accent-soft: #E3ECF8;
  --ok: #1E7A4C; --ok-bg: #E2F3EA;
  --paint: #F2C200; --paint-ink: #3D3000;
  --warn: #9A4F06; --warn-bg: #FBEEDA; --bad: #B3261E;
  --metal: #CDD3D9; --metal-2: #B1BAC2; --metal-3: #86929C; --metal-line: #6B7782; --caliper: #B8322A;
  --hi: #FBFCFD; --shade: #5E6870; --iron: #7D7873; --iron-hi: #A8A39D; --rubber: #24282C; --rubber-hi: #4E555B;
  --caliper-hi: #E25D52; --caliper-dk: #7E1C16; --ceramic: #F7F5F0; --ceramic-sh: #C4BFB5; --filter: #2E5EA6; --filter-dk: #142F57; --brass: #C08F3A;
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F151B; --surface: #172029; --sunk: #121A21; --ink: #E5EBF0; --ink-2: #9AA8B4; --line: #2A3641;
  --accent: #74A6F2; --accent-ink: #0B1520; --accent-soft: #1C2D44;
  --ok: #5CC98F; --ok-bg: #143323;
  --paint: #F2C200; --paint-ink: #2A2100;
  --warn: #F1A95B; --warn-bg: #36260F; --bad: #F2867E;
  --metal: #3A4652; --metal-2: #4B5865; --metal-3: #66737F; --metal-line: #8C99A4; --caliper: #C9463D;
  --hi: #AEB9C3; --shade: #1A222A; --iron: #4A4541; --iron-hi: #6E6862; --rubber: #0C0E10; --rubber-hi: #343A40;
  --caliper-hi: #E66E63; --caliper-dk: #6A1814; --ceramic: #DCD8D0; --ceramic-sh: #8E8981; --filter: #3B6DB8; --filter-dk: #16305A; --brass: #B08636;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F151B; --surface: #172029; --sunk: #121A21; --ink: #E5EBF0; --ink-2: #9AA8B4; --line: #2A3641;
  --accent: #74A6F2; --accent-ink: #0B1520; --accent-soft: #1C2D44;
  --ok: #5CC98F; --ok-bg: #143323;
  --paint: #F2C200; --paint-ink: #2A2100;
  --warn: #F1A95B; --warn-bg: #36260F; --bad: #F2867E;
  --metal: #3A4652; --metal-2: #4B5865; --metal-3: #66737F; --metal-line: #8C99A4; --caliper: #C9463D;
  --hi: #AEB9C3; --shade: #1A222A; --iron: #4A4541; --iron-hi: #6E6862; --rubber: #0C0E10; --rubber-hi: #343A40;
  --caliper-hi: #E66E63; --caliper-dk: #6A1814; --ceramic: #DCD8D0; --ceramic-sh: #8E8981; --filter: #3B6DB8; --filter-dk: #16305A; --brass: #B08636;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.muted { color: var(--ink-2); }
.inner { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* app bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar .inner { display: flex; align-items: center; gap: 10px 14px; padding-block: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.logo svg { width: 30px; height: 30px; flex: none; }
.logo b { font-family: var(--f-display); font-size: 26px; font-weight: 700; letter-spacing: .01em; line-height: 1; }
.logo b span { color: var(--accent); }
.carbtn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 6px 8px 6px 14px; max-width: 100%; min-width: 0; }
.carbtn b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.carbtn svg { width: 18px; height: 18px; flex: none; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--sunk); padding: 3px; flex: none; }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.views { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.views button { flex: none; border: 0; background: none; padding: 10px 14px 11px; font-family: var(--f-display); font-size: 19px; font-weight: 600; color: var(--ink-2); border-bottom: 3px solid transparent; }
.views button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 18px 56px; display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 14px; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.big { padding: 12px 18px; font-size: 16px; font-weight: 600; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg { width: 18px; height: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.msg { font-size: 13.5px; padding: 9px 12px; border-radius: 9px; background: var(--sunk); border: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.msg.err { color: var(--bad); }

/* car summary */
.car { padding: 18px; display: grid; gap: 14px; }
.car-top { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-start; justify-content: space-between; }
.car h1 { font-size: 34px; line-height: 1.05; }
.car .sub { color: var(--ink-2); font-size: 14px; }
.meter { display: grid; gap: 6px; min-width: 220px; flex: 1 1 260px; max-width: 420px; }
.meter .bar { height: 10px; border-radius: 99px; background: var(--warn-bg); overflow: hidden; border: 1px solid var(--line); }
.meter .bar i { display: block; height: 100%; background: var(--ok); }
.meter .txt { font-size: 13.5px; }
.manual { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 8px; font-size: 14px; }
.manual p { margin: 0; max-width: 75ch; }
.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 14px; }
.links a { color: var(--accent); font-weight: 500; overflow-wrap: anywhere; }
.ask { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ask input { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--sunk); padding: 8px 11px; }

/* job tabs + bench */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tab .n { font-family: var(--f-mono); font-size: 12px; opacity: .75; margin-left: 4px; }
.bench { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.diagram { margin: 0; padding: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 120px); }
@media (max-width: 860px) { .diagram { position: static; } }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram figcaption { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.badge-g { cursor: pointer; }
.badge-g circle { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.badge-g text { font-family: var(--f-mono); font-size: 12px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.badge-g.on circle { fill: var(--accent); stroke: var(--accent); }
.badge-g.on text { fill: var(--accent-ink); }
.leader { stroke: var(--ink-2); stroke-width: 1; fill: none; }
.leader.on { stroke: var(--accent); stroke-width: 2; }
.hot { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
.hot.on { opacity: 1; }
.noshape { display: grid; place-items: center; gap: 8px; min-height: 200px; text-align: center; color: var(--ink-2); padding: 20px; }
.noshape svg { width: 72px; color: var(--metal-3); }

.specs { display: grid; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; cursor: pointer; }
.row.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.row .num { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; font-weight: 600; margin-top: 1px; }
.row.on .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row .num.dot { border-style: dashed; color: var(--ink-2); }
.row .name { font-weight: 600; line-height: 1.3; }
.row .fast { color: var(--ink-2); font-size: 13px; }
.tq { text-align: right; white-space: nowrap; }
.tq .big { font-family: var(--f-mono); font-size: 20px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tq .alt { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); }
.tq .none { font-size: 13px; color: var(--warn); font-weight: 600; }
.row .more { grid-column: 2 / -1; display: grid; gap: 10px; padding-top: 8px; border-top: 1px dashed var(--line); margin-top: 6px; font-size: 14px; }
.row .more p { margin: 0; }
.k { font-weight: 600; }
.pills { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.pill.ver { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 40%, transparent); color: var(--ok); }
.pill.unver { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-bg); }
.pill.angle { font-family: var(--f-mono); color: var(--ink); }
.pill svg { width: 12px; height: 12px; }

.edit { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding-top: 10px; border-top: 1px dashed var(--line); margin-top: 6px; cursor: default; }
.edit .wide { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); padding: 8px 10px; width: 100%; min-width: 0; }
.field textarea { min-height: 60px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.edit .actions { grid-column: 1 / -1; }

/* photos */
.photos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.thumb { width: 76px; height: 76px; border-radius: 9px; border: 1px solid var(--line); background: var(--sunk); padding: 0; overflow: hidden; display: grid; place-items: center; cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.add { border-style: dashed; color: var(--accent); font-size: 12px; font-weight: 600; text-align: center; line-height: 1.2; gap: 2px; align-content: center; }
.thumb.add svg { width: 22px; height: 22px; }
.thumb.busy { cursor: default; color: var(--ink-2); }
.figphoto { margin-top: 12px; display: grid; gap: 6px; }
.figphoto img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 9px; border: 1px solid var(--line); cursor: zoom-in; background: var(--sunk); }

/* guides */
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.gcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; align-content: start; }
.gcard:hover { border-color: var(--ink-2); }
.gcard h3 { font-size: 22px; font-weight: 600; }
.gcard p { margin: 0; color: var(--ink-2); font-size: 14px; }
.gmeta { display: flex; flex-wrap: wrap; gap: 6px; }
.lvl { display: inline-flex; gap: 2px; align-items: center; }
.lvl i { width: 6px; height: 12px; border-radius: 2px; background: var(--line); display: inline-block; }
.lvl i.on { background: var(--accent); }
.guide { padding: 18px; display: grid; gap: 16px; }
.guide h2 { font-size: 30px; }
.gcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .gcols { grid-template-columns: minmax(0, 1fr); } }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--sunk); display: grid; gap: 8px; align-content: start; }
.box ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }
.steps li .box2 { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--ink-2); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.steps li.done { opacity: .62; }
.steps li.done .box2 { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.chip { display: inline-flex; align-items: baseline; gap: 4px; padding: 0 7px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); font-weight: 600; white-space: normal; }
.chip .mono { font-weight: 600; }
.chip.missing { background: var(--warn-bg); color: var(--warn); }
.warnbox { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 10px 12px; border-radius: 8px; font-size: 14px; }

/* parts */
.parts { padding: 16px 18px; display: grid; gap: 12px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.part { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; display: grid; gap: 5px; align-content: start; background: var(--sunk); }
.part .v { font-weight: 600; overflow-wrap: anywhere; }
.part .v.empty { color: var(--ink-2); font-weight: 400; font-style: italic; }
.part .foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.flist { display: grid; gap: 6px; }
.frow { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; border-bottom: 1px dashed var(--line); padding-bottom: 5px; flex-wrap: wrap; }
.frow b { font-family: var(--f-mono); }
.frow .buy { margin-left: auto; }
.parts-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 16px; flex-wrap: wrap; }
.storepick { display: grid; gap: 3px; }
.storepick select { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 6px 10px; font-weight: 500; }
.btn.buy { text-decoration: none; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.btn.buy svg { width: 16px; height: 16px; }
.buylist { list-style: none; padding: 0 !important; }
.buylist li { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; padding: 4px 0; border-bottom: 1px dashed var(--line); }

/* sheet (add car / switch car) */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, #000 45%, transparent); display: grid; place-items: end center; }
@media (min-width: 700px) { .sheet-bg { place-items: center; } }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: grid; gap: 14px; }
@media (min-width: 700px) { .sheet { border-radius: 18px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet h2 { font-size: 26px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; }
.or::before, .or::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.vin { font-family: var(--f-mono); letter-spacing: .12em; text-transform: uppercase; font-size: 17px !important; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.carlist { display: grid; gap: 8px; }
.carlist button { text-align: left; border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 10px 14px; display: grid; gap: 1px; }
.carlist button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.carlist b { font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.carlist small { color: var(--ink-2); }

/* welcome */
.welcome { padding: 28px 22px; display: grid; gap: 16px; justify-items: start; }
.welcome h1 { font-size: 42px; line-height: 1; max-width: 18ch; }
.welcome p { margin: 0; color: var(--ink-2); max-width: 60ch; font-size: 16px; }

.lb { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--shade) 88%, #000); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lb-top, .lb-bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; color: var(--hi); }
.lb-top b { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.lb img { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
.toast { position: fixed; z-index: 30; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 560px; margin: 0 auto;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 12px 12px 16px; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 8px 28px color-mix(in srgb, #000 30%, transparent); }

async function runAsk(v, q) {

  const deg = parseFloat(String(s.angle).replace(/[^\d.]/g, "")) || 0;
  const turn = deg === 90 ? "a quarter turn" : deg === 180 ? "a half turn" : deg === 45 ? "an eighth of a turn" : deg === 60 ? "one hex flat" : `${deg}°`;
  return `<div class="box"><span class="label">Torque + angle</span><ol style="margin:0;padding-left:18px">
    <li>Tighten to <b class="mono">${torque(s.nm).big}</b> with a torque wrench.</li>
    <li>Mark the bolt head and the part with a paint pen.</li>
    <li>Turn a further <b>${esc(s.angle)}</b> (${turn}) in one smooth pull. An angle gauge makes this accurate.</li></ol>
    ${SINGLE_USE.test(s.notes || "") ? "" : '<p class="muted" style="margin:0;font-size:13px">Torque-plus-angle bolts usually stretch: most makers say replace them. Check your manual.</p>'}</div>`;
}
function verPill(x) {
  return x.verified ? `<span class="pill ver">${ICON_CHECK}Verified${x.page ? " · Manual " + esc(x.page) : ""}${x.shared ? " · shared" : ""}</span>` : `<span class="pill unver">Not verified</span>`;
}
function photosHTML(s) {
  const ph = s.photos || [];
  const up = S.uploading[s.id], err = S.photoErr[s.id];
  if (!ph.length && !S.assets) return "";
  const thumbs = ph.map((id, i) => `<button class="thumb" data-act="open-photo" data-id="${s.id}" data-i="${i}" aria-label="Open photo ${i + 1}"><img src="${blobUrl(id)}" alt="Your photo ${i + 1} of ${esc(s.name)}" loading="lazy"></button>`).join("");
  const add = !S.assets ? "" : up ? `<span class="thumb add busy"><span class="spin"></span>Uploading</span>`
    : ph.length < MAX_PHOTOS ? `<label class="thumb add" data-act="noop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Add photo<input type="file" accept="image/*" multiple hidden data-photo="${s.id}" id="ph-${s.id}"></label>` : "";
  return `<div><p class="k" style="margin:0 0 6px">Your photos</p><div class="photos">${thumbs}${add}</div>
    ${err ? `<p style="color:var(--bad);font-size:13px;margin:6px 0 0">${esc(err)}</p>` : !ph.length ? `<p class="muted" style="font-size:13px;margin:6px 0 0">Snap this bolt on your car so you know exactly what to look for next time.</p>` : ""}</div>`;
}
function rowHTML(row) {
  const on = row.key === S.selected, s = row.spec;
  const a = row.atlas ? ATLAS[row.atlas] : null, n = row.atlas ? atlasNum(row.atlas) : null;
  const num = n ? `<span class="num">${n}</span>` : `<span class="num dot" aria-hidden="true">·</span>`;
  let tq;
  if (s.nm) { const t = torque(s.nm); tq = `<div class="big">${t.big}</div><div class="alt">${t.alt}</div>`; }
  else if (a && a.hand && s.verified) tq = `<div class="alt">${esc(a.hand)}</div>`;
  else if (s.rule) tq = `<div class="alt">${esc(s.rule)}</div>`;
  else tq = `<div class="none">No value yet</div>`;
  const pills = `<div class="pills">${s.angle ? `<span class="pill angle">then ${esc(s.angle)}</span>` : ""}${verPill(s)}${SINGLE_USE.test(s.notes || "") ? `<span class="pill unver">Replace bolt / nut</span>` : ""}${(s.photos || []).length ? `<span class="pill">${s.photos.length} photo${s.photos.length > 1 ? "s" : ""}</span>` : ""}</div>`;
  let more = "";
  if (on) {
    const parts = [];
    if (s.angle && s.nm) parts.push(angleSteps(s));
    if (s.notes) parts.push(`<p><span class="k">Notes:</span> ${esc(s.notes)}</p>`);
    if (!s.verified) parts.push(`<p class="warnbox">Check this against the factory manual${s.hintPage ? ` (try ${esc(s.hintPage)})` : ""}, then tap Mark verified and enter the page.</p>`);
    if (a) parts.push(`<p><span class="k">What it looks like:</span> ${esc(a.look)}</p>`, `<p><span class="k">Tip:</span> ${esc(a.tip)}</p>`);
    parts.push(photosHTML(s));
    if (S.editing !== row.key) parts.push(`<div class="actions">
      ${!s.verified ? `<button class="btn small primary" data-act="edit" data-id="${s.id}" data-verify="1">Mark verified</button>` : ""}
      <button class="btn small" data-act="edit" data-id="${s.id}">Edit</button>
      <button class="btn small danger${S.armedDelete === "s:" + s.id ? " armed" : ""}" data-act="del-spec" data-id="${s.id}">${S.armedDelete === "s:" + s.id ? "Tap again to remove" : "Remove"}</button></div>`);
    more = `<div class="more">${parts.join("")}</div>`;
  }
  const edit = S.editing === row.key ? editHTML(s) : "";
  return `<div class="row${on ? " on" : ""}" data-act="pick" data-key="${esc(row.key)}" tabindex="0" aria-expanded="${on}">
    ${num}<div><div class="name">${esc(row.name)}</div>${s.fastener ? `<div class="fast">${esc(s.fastener)}</div>` : ""}</div><div class="tq">${tq}</div>${pills}${more}${edit}</div>`;
}
function editHTML(s) {
  const nmVal = s.nm ? (S.unit === "nm" ? r(s.nm) : r(toFt(s.nm))) : "";
  const jobOpts = JOBS.map((j) => `<option value="${j.id}"${j.id === s.job ? " selected" : ""}>${esc(j.name)}</option>`).join("");
  const atlasOpts = `<option value="">None (not on diagram)</option>` + ATLAS_IDS.filter((id) => ATLAS[id].job === s.job).map((id) => `<option value="${id}"${id === s.atlas ? " selected" : ""}>${esc(ATLAS[id].name)}</option>`).join("");
  const wantVerify = S.editVerify || s.verified;
  return `<form class="edit" data-form="spec" data-id="${s.id}">
    <label class="field wide"><span class="label">Name</span><input id="e-name" name="name" required value="${esc(s.name)}"></label>
    <label class="field"><span class="label">Torque (${S.unit === "nm" ? "N·m" : "ft-lb"})</span><input id="e-nm" name="nm" inputmode="decimal" value="${nmVal}"></label>
    <label class="field"><span class="label">Then angle</span><input id="e-angle" name="angle" placeholder="+90°" value="${esc(s.angle || "")}"></label>
    <label class="field"><span class="label">Size / tool</span><input id="e-fast" name="fastener" placeholder="14 mm, T-55" value="${esc(s.fastener || "")}"></label>
    <label class="field"><span class="label">Job</span><select id="e-job" name="job">${jobOpts}</select></label>
    <label class="field"><span class="label">Diagram spot</span><select id="e-atlas" name="atlas">${atlasOpts}</select></label>
    <label class="field wide"><span class="label">Notes</span><textarea id="e-notes" name="notes">${esc(s.notes || "")}</textarea></label>
    <label class="check wide"><input id="e-ver" type="checkbox" name="verified" ${wantVerify ? "checked" : ""}> I checked this value in the factory service manual</label>
    <label class="field"><span class="label">Manual page</span><input id="e-page" name="page" placeholder="BR-37" value="${esc(s.page || s.hintPage || "")}"></label>
    <div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-act="cancel-edit">Cancel</button></div>
  </form>`;
}

function carCard(v) {
  const specs = v.specs || [], ver = specs.filter((s) => s.verified).length, total = specs.length;
  const pct = total ? Math.round((ver / total) * 100) : 0;
  const busy = S.busy[v.id], note = S.notice[v.id];
  const man = MANUALS[v.make];
  return `<section class="panel car">
    <div class="car-top">
      <div style="min-width:0"><span class="label">Your car</span><h1>${esc(vName(v))}</h1><div class="sub">${esc(vSub(v) || "Trim and engine not set")}${v.vin ? ` · <span class="mono">${esc(v.vin)}</span>` : ""}</div></div>
      <div class="meter"><div class="txt"><b>${ver} of ${total}</b> torque specs verified from the factory manual</div><div class="bar"><i style="width:${pct}%"></i></div>
        <div class="actions"><button class="btn small" data-act="toggle-manual">${S.showManual ? "Hide manual links" : "Verify with the manual"}</button></div></div>
    </div>
    ${S.showManual ? `<div class="manual">
      <p>${man ? `Factory service information for ${esc(v.make)}: <a href="${man.url}" target="_blank" rel="noopener">${esc(man.name)}</a>.` : `Use the factory service manual for your ${esc(v.make)} (the maker's technician site, often paid by the day).`} Open a section, find the torque in its drawings or specs table, then tap <b>Mark verified</b> on the bolt and enter the page.</p>
      ${fsmLinks(v)}
    </div>` : ""}
    <form class="ask" data-form="ask">
      <input id="ask-q" name="q" placeholder="Find a bolt: rear caliper bracket, subframe, alternator…" aria-label="Find a bolt's torque spec" ${busy ? "disabled" : ""}>
      <button class="btn primary" type="submit" ${busy ? "disabled" : ""}>Find spec</button>
      <button class="btn" type="button" data-act="add-spec">Add a bolt</button>
      <button class="btn" type="button" data-act="lookup" ${busy ? "disabled" : ""}>${v.lookedUpAt ? "Look up again" : "Look up specs"}</button>
    </form>
    ${busy ? `<div class="msg"><span class="spin"></span>${esc(busy)}</div>` : note ? `<div class="msg${note.err ? " err" : ""}">${esc(note.text)}</div>` : ""}
  </section>`;
}

function specsView(v) {
  const job = JOBS.find((j) => j.id === S.job) || JOBS[0];
  const rows = rowsFor(v, job.id);
  if (!rows.some((x) => x.key === S.selected)) S.selected = rows[0]?.key || null;
  const counts = Object.fromEntries(JOBS.map((j) => [j.id, rowsFor(v, j.id).length]));
  const tabs = JOBS.filter((j) => j.id !== "other" || counts.other).map((j) => `<button class="tab" role="tab" data-act="job" data-job="${j.id}" aria-selected="${j.id === job.id}">${esc(j.name)}<span class="n">${counts[j.id]}</span></button>`).join("");
  const selSpec = rows.find((x) => x.key === S.selected)?.spec;
  const figPhoto = selSpec && (selSpec.photos || []).length
    ? `<div class="figphoto"><img src="${blobUrl(selSpec.photos[0])}" alt="Your photo of ${esc(selSpec.name)}" data-act="open-photo" data-id="${selSpec.id}" data-i="0"><span class="label">Your photo · ${esc(selSpec.name)}</span></div>` : "";
  const figure = job.diagram
    ? `<figure class="panel diagram">${diagramSVG(job, rows)}<figcaption>Illustration. Tap a number to jump to that bolt. Your car's layout may differ.</figcaption>${figPhoto}</figure>`
    : `<figure class="panel diagram">${figPhoto || `<div class="noshape">${GLYPH}<div>Select a bolt to see what it looks like and where to find it.</div></div>`}</figure>`;
  const list = rows.length ? rows.map(rowHTML).join("")
    : `<div class="panel noshape" style="min-height:140px"><div>No ${esc(job.name.toLowerCase())} specs for this car yet.</div><div class="actions"><button class="btn" data-act="add-spec">Add a bolt</button></div></div>`;
  return `${carCard(v)}<div class="tabs" role="tablist">${tabs}</div><div class="bench">${figure}<div class="specs">${list}</div></div>`;
}

/* ---------- guides view ---------- */
function specChips(v, atlasId) {
  const specs = (v.specs || []).filter((s) => s.atlas === atlasId);
  if (!specs.length) {
    const a = ATLAS[atlasId];
    return a && a.hand ? `<span class="chip">${esc(a.hand)}</span>` : `<span class="chip missing">${esc(a ? a.name : atlasId)}: not in your specs yet</span>`;
  }
  return specs.map((s) => `<span class="chip"${s.verified ? "" : ` title="Not verified"`}>${specs.length > 1 ? esc(s.name) + ": " : ""}<span class="mono">${s.nm ? torque(s.nm).big : s.notes ? esc(s.notes.split(".")[0]) : "no value"}</span>${s.angle ? " then " + esc(s.angle) : ""}${s.verified ? "" : " (not verified)"}</span>`).join(" ");
}
function partChip(v, key) {
  const p = (v.parts || {})[key], label = PARTS.find((x) => x.key === key)?.label || key;
  return p && p.value ? `<span class="chip">${esc(p.value)}${p.verified ? "" : " (not verified)"}</span>` : `<span class="chip missing">${esc(label)}: not set</span>`;
}
function fillTokens(v, text) {
  return esc(text).replace(/\{spec:(\w+)\}/g, (m, id) => specChips(v, id)).replace(/\{part:(\w+)\}/g, (m, key) => partChip(v, key));
}
const lvl = (n) => `<span class="lvl" aria-label="Difficulty ${n} of 3">${[1, 2, 3].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
const LEVELS = ["", "Easy", "Moderate", "Advanced"];
function guideDone(v, g) { try { return JSON.parse(LS.get(`diygnose.g.${v.id}.${g.id}`) || "[]"); } catch (e) { return []; } }
function guidesView(v) {
  const g = GUIDES.find((x) => x.id === S.guide);
  if (!g) {
    return `<section style="display:grid;gap:4px"><h2 style="font-size:28px">DIY guides for your ${esc(v.model)}</h2><p class="muted" style="margin:0">Step-by-step jobs with your car's own torque specs and parts filled in.</p></section>
      <div class="ggrid">${GUIDES.map((x) => {
        const done = guideDone(v, x).length;
        return `<button class="gcard" data-act="guide" data-id="${x.id}"><span class="label">${esc(x.time)}</span><h3>${esc(x.title)}</h3><p>${esc(x.blurb)}</p>
          <div class="gmeta"><span class="pill">${lvl(x.level)} ${LEVELS[x.level]}</span>${done ? `<span class="pill">${done}/${x.steps.length} steps done</span>` : ""}</div></button>`;
      }).join("")}</div>`;
  }
  const done = new Set(guideDone(v, g));
  return `<div><button class="btn small" data-act="guide" data-id="">← All guides</button></div>
    <section class="panel guide">
      <div><span class="label">${esc(vName(v))} · ${esc(g.time)} · ${LEVELS[g.level]}</span><h2>${esc(g.title)}</h2></div>
      <div class="gcols">
        <div class="box"><span class="label">Parts & fluids for your car</span>${ctReady(v) ? "" : `<p class="muted" style="margin:0;font-size:13px">Shop buttons go to Canadian Tire. Add your car there once so they show only parts that fit (steps in Parts &amp; fluids).</p>`}<ul class="buylist">${g.parts.map((k) => `<li><span>${esc(PARTS.find((p) => p.key === k)?.label || k)}: ${partChip(v, k)}</span>${partBuy(v, k)}</li>`).join("")}</ul></div>
        <div class="box"><span class="label">Tools</span><ul>${g.tools.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>
      </div>
      <ol class="steps">${g.steps.map((st, i) => `<li class="${done.has(i) ? "done" : ""}" data-act="step" data-g="${g.id}" data-i="${i}"><span class="box2">${done.has(i) ? "✓" : i + 1}</span><span>${fillTokens(v, st)}</span></li>`).join("")}</ol>
      <div class="actions">${MAINT.some((m) => m.id === g.id) ? `<button class="btn small primary" data-act="log-open" data-job="${g.id}">Log this job as done</button>` : ""}<button class="btn small" data-act="reset-guide" data-g="${g.id}">Clear checkmarks</button><button class="btn small" data-act="goto-specs" data-job="${g.job}">See the torque specs</button></div>
    </section>`;
}

/* ---------- parts view ---------- */
function partsView(v) {
  const cards = PARTS.map((p) => {
    const cur = (v.parts || {})[p.key];
    if (S.editingPart === p.key) {
      return `<form class="part" data-form="part" data-key="${p.key}"><span class="label">${esc(p.label)}</span>
        <label class="field"><input id="p-${p.key}" name="value" value="${esc(cur?.value || "")}" placeholder="Value from your manual"></label>
        <label class="check"><input id="pv-${p.key}" type="checkbox" name="verified" ${cur?.verified ? "checked" : ""}> Checked in the factory manual</label>
        <label class="field"><span class="label">Source / page</span><input id="pp-${p.key}" name="page" value="${esc(cur?.page || "")}" placeholder="MA-12"></label>
        <div class="foot"><button class="btn small primary" type="submit">Save</button><button class="btn small" type="button" data-act="cancel-part">Cancel</button></div></form>`;
    }
    return `<div class="part"><span class="label">${esc(p.label)}</span>
      <div class="v${cur?.value ? "" : " empty"}">${cur?.value ? esc(cur.value) : "Not set"}</div>
      ${cur?.value ? "" : `<div class="muted" style="font-size:13px">${esc(p.hint)}</div>`}
      <div class="foot">${cur?.value ? verPill(cur) : ""}<button class="btn small" data-act="edit-part" data-key="${p.key}">${cur?.value ? "Edit" : "Add"}</button>${partBuy(v, p.key)}</div></div>`;
  }).join("");
  return `<section class="panel parts"><div class="parts-head"><div><span class="label">${esc(vName(v))}</span><h2 style="font-size:28px">Parts & fluids</h2></div></div>
    ${ctSetupNote(v)}<div class="pgrid">${cards}</div></section>`;
}

/* ---------- welcome ---------- */
function welcomeView() {
  return `<section class="panel welcome">
    <span class="label">Welcome to DIYgnose</span>
    <h1>Torque specs and DIY guides for your car</h1>
    <p>Add your car by VIN or by picking the year, make and model. You'll get bolt-by-bolt torque specs, oil and parts, and step-by-step guides for common jobs.</p>
    <div class="actions"><button class="btn primary big" data-act="add-car">Add your car</button></div>
    ${S.storage === "local" ? `<p style="font-size:13px">Your garage is saved in this browser.</p>` : ""}
  </section>`;
}

/* ---------- sheets ---------- */
function sheetHTML() {
  if (S.sheet === "cars") {
    return `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="Your cars">
      <div class="sheet-head"><h2>Your garage</h2><button class="btn small" data-act="close-sheet">Close</button></div>
      <div class="carlist">${S.vehicles.map((v) => `<button data-act="pick-car" data-id="${v.id}" aria-pressed="${v.id === S.active}"><b>${esc(vName(v))}</b><small>${esc(vSub(v) || "Trim and engine not set")}</small></button>`).join("")}</div>
      <div class="actions"><button class="btn primary" data-act="add-car">Add a car</button>
      ${vehicle() ? `<button class="btn danger${S.armedDelete === "v:" + S.active ? " armed" : ""}" data-act="del-car">${S.armedDelete === "v:" + S.active ? "Tap again to delete " + esc(vehicle().model) : "Delete " + esc(vehicle().model)}</button>` : ""}</div>
    </div></div>`;
  }
  if (S.sheet !== "add") return "";
  const W = S.W;
  const yr = new Date().getFullYear() + 1;
  const years = []; for (let y = yr; y >= 1990; y--) years.push(y);
  const makes = MAKES;
  const models = W.modelList || [];
  const sel = (id, name, list, val, ph, extra = "") => `<select id="${id}" name="${name}" ${extra}><option value="">${ph}</option>${list.map((x) => `<option${String(x) === String(val) ? " selected" : ""}>${esc(x)}</option>`).join("")}${val && !list.map(String).includes(String(val)) ? `<option selected>${esc(val)}</option>` : ""}</select>`;
  const makeField = sel("w-make", "make", makes, W.make, "Choose make", W.year ? "" : "disabled");
  const modelField = W.modelBusy ? `<select id="w-model" disabled><option>Loading models…</option></select>`
    : models.length ? sel("w-model", "model", models, W.model, "Choose model", W.make ? "" : "disabled")
    : `<input id="w-model" name="model" value="${esc(W.model || "")}" placeholder="Model" ${W.make ? "" : "disabled"}>`;
  const trimField = W.trims && W.trims.length ? sel("w-trim", "trim", W.trims, W.trim, "Choose trim (optional)") : `<input id="w-trim" name="trim" value="${esc(W.trim || "")}" placeholder="e.g. Journey, LE, Sport">`;
  const engField = W.engines && W.engines.length ? sel("w-engine", "engine", [...W.engines, "Not sure"], W.engine, "Choose engine") : `<input id="w-engine" name="engine" value="${esc(W.engine || "")}" placeholder="Not sure? Leave blank">`;
  return `<div class="sheet-bg" data-act="close-sheet"><form class="sheet" data-form="add" role="dialog" aria-modal="true" aria-label="Add a car">
    <div class="sheet-head"><h2>Add a car</h2><button class="btn small" type="button" data-act="close-sheet">Cancel</button></div>
    <div class="field"><span class="label">VIN (fastest)</span>
      <div class="ask"><input id="w-vin" class="vin" name="vin" maxlength="17" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="17 characters" value="${esc(W.vin || "")}">
      <button class="btn" type="button" data-act="decode-vin" ${W.busy ? "disabled" : ""}>Decode</button>
      <label class="btn" data-act="noop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Scan<input type="file" accept="image/*" capture="environment" hidden id="w-scan" data-scan="1"></label></div>
      <span class="muted" style="font-size:12.5px">Find it on the driver's door jamb sticker, at the bottom of the windshield, or on your registration.</span></div>
    ${W.busy ? `<div class="msg"><span class="spin"></span>${esc(W.busy)}</div>` : W.msg ? `<div class="msg${W.err ? " err" : ""}">${esc(W.msg)}</div>` : ""}
    <div class="or">or choose</div>
    <div class="grid2">
      <label class="field"><span class="label">1 · Year</span>${sel("w-year", "year", years, W.year, "Year")}</label>
      <label class="field"><span class="label">2 · Make</span>${makeField}</label>
      <label class="field"><span class="label">3 · Model</span>${modelField}</label>
      <label class="field"><span class="label">4 · Trim</span>${trimField}</label>
      <label class="field"><span class="label">5 · Engine</span>${engField}</label>
    </div>
    ${W.sugBusy ? `<div class="msg"><span class="spin"></span>Finding trims and engines for this model…</div>` : W.sugMsg ? `<div class="msg muted">${esc(W.sugMsg)}</div>` : ""}
    <p class="muted" style="margin:0;font-size:13px">US and Canada market vehicles. Not sure about the engine? Leave it and the lookup will use the most common one; you can change it later.</p>
    <div class="actions"><button class="btn primary big" type="submit">Add car and look up specs</button></div>
  </form></div>`;
}

function renderToast() {
  const box = $("#toast"), v = vehicle();
  if (!S.buyHint || !v || ctReady(v)) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="toast" role="status"><div style="min-width:0"><b>First time on Canadian Tire?</b><p>Tap <b>Add Vehicle</b> at the top of their page and choose this car. Canadian Tire then shows only parts that fit, every time.</p>
    <div class="fit"><span class="mono">${esc(v.year)} · ${esc(String(v.make).toUpperCase())} · ${esc(v.model)} · Region CAN</span></div>
    <div class="fit" style="margin-top:8px"><button class="btn small" data-act="ct-done">Done, it's added</button><button class="btn small" data-act="close-toast">Later</button></div></div></div>`;
}

const KM_PER_MI = 1.609344;
const distOut = (km) => (S.dist === "mi" ? `${Math.round(km / KM_PER_MI).toLocaleString()} mi` : `${Math.round(km).toLocaleString()} km`);

const addMonths = (iso, m) => { const d = new Date(iso + "T12:00:00"); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); };
const daysUntil = (iso) => Math.round((new Date(iso + "T12:00:00") - new Date(today() + "T12:00:00")) / 86400000);
const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
function intervalFor(v, id) { const base = MAINT.find((m) => m.id === id) || { km: 0, months: 0 }; const o = (v.intervals || {})[id]; return { km: o?.km ?? base.km, months: o?.months ?? base.months, custom: !!o }; }
function dueFor(v, m) {

  const iv = intervalFor(v, m.id);
  if (!last) return { m, iv, last: null, status: "none" };
  const nextKm = iv.km && last.km != null ? last.km + iv.km : null;
  const nextDate = iv.months ? addMonths(last.date, iv.months) : null;
  const leftKm = nextKm != null && v.odometer != null ? nextKm - v.odometer : null;
  const leftDays = nextDate ? daysUntil(nextDate) : null;
  let status = "ok";
  if ((leftKm != null && leftKm < 0) || (leftDays != null && leftDays < 0)) status = "over";
  else if ((leftKm != null && leftKm < 1000) || (leftDays != null && leftDays < 30)) status = "soon";

/* ---------- shared verified library ---------- */
// Verified specs are shared by year, make, model and engine, so the next owner of the same car starts verified.
function engineToken(e) {
  const s = String(e || "").toUpperCase();
  const code = (s.match(/\b(?=[A-Z0-9-]*[A-Z])(?=[A-Z0-9-]*\d)[A-Z0-9-]{4,}\b/g) || []).filter((t) => !/^\d+(\.\d)?L$/.test(t)).sort((a, b) => b.length - a.length)[0];
  if (code) return code.toLowerCase();
  const disp = s.match(/(\d\.\d)\s*L/); return disp ? disp[1] + "l" : "any";
}
const libKey = (v) => [v.year, v.make, v.model, engineToken(v.engine)].join("_").toLowerCase().replace(/[^a-z0-9_.-]+/g, "-").slice(0, 150);
async function readLibrary(v) {
  if (!db) return null;
  try { const s = await db.collection("library").doc(libKey(v)).get(); return s.exists ? s.data() : null; } catch (e) { return null; }
}
async function saveLibrary(v) {
  if (!db || !v) return;
  const specs = (v.specs || []).filter((s) => s.verified && s.page && s.nm).map((s) => ({ atlas: s.atlas, job: s.job, name: s.name, nm: s.nm, angle: s.angle || null, fastener: s.fastener || null, notes: s.notes || null, page: s.page }));
  const parts = Object.fromEntries(Object.entries(v.parts || {}).filter(([, p]) => p && p.verified && p.page && p.value).map(([k, p]) => [k, { value: p.value, page: p.page }]));
  if (!specs.length && !Object.keys(parts).length) return;
  const ref = db.collection("library").doc(libKey(v));
  try {
    const cur = await ref.get(); const old = cur.exists ? cur.data() : {};
    const byName = new Map((old.specs || []).map((s) => [s.name.toLowerCase(), s]));
    for (const s of specs) byName.set(s.name.toLowerCase(), s);
    await ref.set({ year: String(v.year), make: v.make, model: v.model, engine: v.engine || "", specs: [...byName.values()], parts: { ...(old.parts || {}), ...parts }, updatedAt: new Date().toISOString() });
  } catch (e) {}
}

/* ---------- add-car wizard ---------- */
const MAKES = ["Acura", "Alfa Romeo", "Audi", "BMW", "Buick", "Cadillac", "Chevrolet", "Chrysler", "Dodge", "Fiat", "Ford", "Genesis", "GMC", "Honda", "Hummer", "Hyundai", "Infiniti", "Jaguar", "Jeep", "Kia", "Land Rover", "Lexus", "Lincoln", "Mazda", "Mercedes-Benz", "Mercury", "MINI", "Mitsubishi", "Nissan", "Polestar", "Pontiac", "Porsche", "Ram", "Rivian", "Saab", "Saturn", "Scion", "Subaru", "Suzuki", "Tesla", "Toyota", "Volkswagen", "Volvo"];
const modelCache = {};
// Models for a year and make: bundled NHTSA list, then NHTSA live, then the built-in lookup.
async function getModels(year, make) {
  const key = year + "|" + make;
  if (modelCache[key]) return modelCache[key];
  const data = await loadModels();
  let list = data[year] && data[year][make];
  if (!list) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
      const res = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeYear/make/${encodeURIComponent(make)}/modelyear/${year}?format=json`, { signal: ctl.signal });
      clearTimeout(t);
      const j = await res.json();
      list = [...new Set((j.Results || []).map((x) => String(x.Model_Name).trim()).filter((m) => !/chassis|cutaway|stripped|incomplete|motorhome|\bbus\b/i.test(m)))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      if (!list.length) list = null;
    } catch (e) { list = null; }
  }
  if (!list) {
    const sample = await getSample();
    if (sample) {
      try {
        const res = await sample.json(`List every ${make} passenger car, SUV, minivan and pickup model sold in the United States or Canada for model year ${year}. Reply with only a JSON array of model names as ${make} badges them, for example ["Model A", "Model B"].`, { modelTier: "quick", cache: { gcTime: 86400000 } });
        if (Array.isArray(res)) list = res.map(String).slice(0, 80);
      } catch (e) {}
    }
  }
  return (modelCache[key] = list || []);
}
async function loadModelList() {
  const W = S.W; if (!W || !W.year || !W.make) return;
  const key = W.year + "|" + W.make; W.modelKey = key; W.modelBusy = true; render();
  const list = await getModels(W.year, W.make);
  if (S.W !== W || W.modelKey !== key) return;
  W.modelList = list; W.modelBusy = false; render();
}

function openAdd() { S.W = { year: "", make: "", model: "", trim: "", engine: "", vin: "", trims: [], engines: [], modelList: [] }; S.sheet = "add"; render(); loadModels(); }
async function suggestTrims() {
  const W = S.W; if (!W || !W.year || !W.make || !W.model) return;
  const sample = await getSample();
  if (!sample) return;
  const key = `${W.year}|${W.make}|${W.model}`; W.sugKey = key; W.sugBusy = true; W.sugMsg = null; render();
  try {
    const res = await sample.json(`List the trims and engine options sold in the United States and Canada for the ${W.year} ${W.make} ${W.model}.
Reply with only JSON: {"trims": ["Base", "Journey"], "engines": ["3.7L V6 (VQ37VHR)"]}. Use real US/Canada trim names. Keep engine labels short with the engine code if known.`, { modelTier: "quick", cache: { gcTime: 86400000 } });
    if (S.W !== W || W.sugKey !== key) return;
    W.trims = Array.isArray(res?.trims) ? res.trims.map(String).slice(0, 20) : [];
    W.engines = Array.isArray(res?.engines) ? res.engines.map(String).slice(0, 10) : [];
    if (W.engines.length === 1 && !W.engine) W.engine = W.engines[0];
    W.sugMsg = W.trims.length || W.engines.length ? null : "No trim list found. Type them in if you know them.";
  } catch (e) { W.sugMsg = "Couldn't load trims. Type them in if you know them."; }

}
async function applyVin(vin) {
  const W = S.W; if (!W) return;
  W.vin = vin; W.msg = null; W.err = false;
  if (!vinShape(vin)) { W.msg = "A VIN has 17 letters and numbers, without I, O or Q."; W.err = true; render(); return; }
  const checkOk = vinCheckOk(vin);
  W.busy = "Decoding your VIN…"; render();
  try {
    const d = await decodeVin(vin);
    if (S.W !== W) return;
    await loadModels();
    Object.assign(W, { year: d.year || W.year, make: d.make || W.make, model: d.model || W.model, trim: d.trim || W.trim, engine: d.engine || W.engine, drive: d.drive || "" });
    W.msg = (d.source === "NHTSA" ? "Decoded with NHTSA's VIN database." : d.source === "lookup" ? "Decoded automatically. Check each field matches your car." : `Model year ${d.year || "unknown"} from the VIN. Pick the rest below.`) + (checkOk ? "" : " The VIN check digit doesn't match: check for a typo.");
    W.err = !checkOk;
  } catch (e) { W.msg = "Couldn't decode that VIN. Pick your car below."; W.err = true; }
  finally { if (S.W === W) { W.busy = null; render(); if (W.year && W.make) loadModelList(); if (W.year && W.make && W.model && !W.trims.length) suggestTrims(); } }
}

    case "del-car": {
      const key = "v:" + v.id;
      if (S.armedDelete !== key) { S.armedDelete = key; render(); break; }
      S.armedDelete = null; S.vehicles = S.vehicles.filter((x) => x.id !== v.id);
      store.remove(v.id).then(() => dropAssets((v.specs || []).flatMap((s) => s.photos || []))).catch(() => {});
      S.active = S.vehicles[0]?.id || null; S.sheet = null; savePrefs(); render(); break;
    }
    case "lookup": if (v) runLookup(v); break;
    case "add-spec": {
      const s = { id: uid(), atlas: null, job: S.job, name: "New bolt", nm: null, angle: null, fastener: null, notes: null, page: null, verified: false, manual: true };
      upsert({ ...v, specs: [...(v.specs || []), s] }); S.selected = s.id; S.editing = s.id; S.editVerify = true; render();
      const n = $("#e-name"); if (n) { n.focus(); n.select(); } break;
    }
    case "edit-part": S.editingPart = el.dataset.key; render(); $("#p-" + el.dataset.key)?.focus(); break;
    case "cancel-part": S.editingPart = null; render(); break;
    case "guide": S.guide = el.dataset.id || null; render(); window.scrollTo(0, 0); break;
    case "step": {
      const g = GUIDES.find((x) => x.id === el.dataset.g), i = +el.dataset.i, done = new Set(guideDone(v, g));
      done.has(i) ? done.delete(i) : done.add(i); LS.set(`diygnose.g.${v.id}.${g.id}`, JSON.stringify([...done])); render(); break;
    }
    case "reset-guide": LS.set(`diygnose.g.${v.id}.${el.dataset.g}`, "[]"); render(); break;
    case "goto-specs": S.view = "specs"; S.job = el.dataset.job; S.selected = null; render(); window.scrollTo(0, 0); break;
    case "open-photo": S.viewer = { specId: el.dataset.id, i: Number(el.dataset.i) || 0 }; renderLightbox(); $("#lb-close")?.focus(); break;
    case "close-photo": S.viewer = null; renderLightbox(); break;
    case "step-photo": if (S.viewer) { S.viewer.i += Number(el.dataset.d); renderLightbox(); } break;
    case "del-photo": {
      const ov = S.viewer && ownerOf(S.viewer.specId); if (!ov) break;
      const sp = ov.specs.find((x) => x.id === S.viewer.specId), id = sp.photos[S.viewer.i];
      if (S.armedDelete !== "p:" + id) { S.armedDelete = "p:" + id; renderLightbox(); break; }
      S.armedDelete = null;
      upsert({ ...ov, specs: ov.specs.map((x) => (x.id === sp.id ? { ...x, photos: x.photos.filter((p) => p !== id) } : x)) }).then(() => dropAssets([id]));
      render(); break;
    }
  }
});
document.addEventListener("keydown", (ev) => {
  if (S.viewer) {
    if (ev.key === "Escape") { S.viewer = null; renderLightbox(); }
    else if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
      const ov = ownerOf(S.viewer.specId), n = (ov?.specs.find((x) => x.id === S.viewer.specId)?.photos || []).length;
      S.viewer.i = Math.max(0, Math.min(n - 1, S.viewer.i + (ev.key === "ArrowRight" ? 1 : -1))); renderLightbox();
    }
    return;
  }
  if (ev.key === "Escape" && S.sheet) { S.sheet = null; S.W = null; render(); return; }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".row, .badge-g, .steps li")) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.dataset.photo) { addPhotos(t.dataset.photo, Array.from(t.files || [])); return; }
  if (t.dataset.scan) {
    const f = t.files && t.files[0]; if (!f || !S.W) return;
    const W = S.W; W.busy = "Reading the VIN from your photo…"; W.msg = null; render();
    try { const vin = await vinFromPhoto(f); if (S.W !== W) return; W.busy = null; await applyVin(vin); }
    catch (e) { if (S.W !== W) return; W.busy = null; W.err = true; W.msg = e && e.code === "no_reader" ? "Photo scanning isn't available here. Type the VIN instead." : "Couldn't read a VIN in that photo. Get closer to the barcode or type it in."; render(); }
    return;
  }
  if (S.W && t.closest("form[data-form=add]")) {
    const W = S.W, name = t.name, val = t.value;
    if (name === "year") { W.year = val; W.make = ""; W.model = ""; W.trim = ""; W.engine = ""; W.trims = []; W.engines = []; W.modelList = []; }
    else if (name === "make") { W.make = val; W.model = ""; W.trim = ""; W.engine = ""; W.trims = []; W.engines = []; W.modelList = []; render(); loadModelList(); return; }
    else if (name === "model") { W.model = val; W.trim = ""; W.engine = ""; W.trims = []; W.engines = []; }
    else if (name === "trim") W.trim = val;
    else if (name === "engine") W.engine = val;
    else if (name === "vin") { W.vin = cleanVin(val); return; }
    render();
    if (name === "model" && val) suggestTrims();
    return;
  }
  if (t.id === "e-job") {
    const sel = $("#e-atlas"); const job = t.value;
    sel.innerHTML = `<option value="">None (not on diagram)</option>` + ATLAS_IDS.filter((id) => ATLAS[id].job === job).map((id) => `<option value="${id}">${esc(ATLAS[id].name)}</option>`).join("");
  }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "w-vin" && S.W) {
    const v = cleanVin(ev.target.value); S.W.vin = v;
    if (v.length === 17 && vinShape(v)) applyVin(v);
  }
});
document.addEventListener("submit", (ev) => {
  const form = ev.target; ev.preventDefault();
  const kind = form.dataset.form, v = vehicle();
  if (kind === "add") {
    const W = S.W; for (const n of ["year", "make", "model", "trim", "engine"]) { const el = form.elements[n]; if (el && el.value) W[n] = el.value; }
    if (W.year && W.make && W.model) createVehicle(); else { W.msg = "Enter a VIN, or pick the year, make and model first."; W.err = true; render(); }
  }
  if (kind === "odo") {
    const n = parseFloat(String(new FormData(form).get("odo") || "").replace(/[^\d.]/g, ""));
    if (isFinite(n) && n >= 0) { upsert({ ...v, odometer: Math.round(distIn(n)) }); render(); }
  }
  if (kind === "log") {
    const f = new FormData(form); const n = parseFloat(String(f.get("km") || "").replace(/[^\d.]/g, ""));
    const km = isFinite(n) ? Math.round(distIn(n)) : null;
    const entry = { id: uid(), job: String(f.get("job")), date: String(f.get("date") || today()), km, notes: String(f.get("notes") || "").trim().slice(0, 200) || null };
    upsert({ ...v, log: [...(v.log || []), entry], odometer: km != null && (v.odometer == null || km > v.odometer) ? km : v.odometer });
    S.logJob = null; render();
  }
  if (kind === "interval") {
    const f = new FormData(form), job = form.dataset.job;
    const kmN = parseFloat(String(f.get("km") || "").replace(/[^\d.]/g, "")), mo = parseInt(String(f.get("months") || ""), 10);
    upsert({ ...v, intervals: { ...(v.intervals || {}), [job]: { km: isFinite(kmN) ? Math.round(distIn(kmN)) : 0, months: isFinite(mo) ? mo : 0 } } });
    S.editInterval = null; render();
  }
  if (kind === "ask") { const q = String(new FormData(form).get("q") || "").trim(); if (q && v) runAsk(v, q.slice(0, 200)); }
  if (kind === "spec") {
    const f = new FormData(form);
    const raw = parseFloat(String(f.get("nm") || "").replace(",", "."));
    const nm = isFinite(raw) && raw > 0 ? (S.unit === "nm" ? raw : raw / 0.737562) : null;
    const job = String(f.get("job")); const atlas = String(f.get("atlas") || "");
    updateSpec(form.dataset.id, {
      name: String(f.get("name")).trim().slice(0, 120) || "Bolt", nm: nm ? Math.round(nm * 100) / 100 : null,
      angle: String(f.get("angle") || "").trim() || null, fastener: String(f.get("fastener") || "").trim() || null,
      notes: String(f.get("notes") || "").trim() || null, job, atlas: ATLAS[atlas] && ATLAS[atlas].job === job ? atlas : null,
      verified: !!f.get("verified"), page: String(f.get("page") || "").trim().slice(0, 30) || null, manual: true,
    });
    S.editing = null; S.job = job; render(); saveLibrary(vehicle());
  }
  if (kind === "part") {
    const f = new FormData(form); const key = form.dataset.key; const value = String(f.get("value") || "").trim().slice(0, 300);
    const p = { ...(v.parts || {}) };
    if (value) p[key] = { value, verified: !!f.get("verified"), page: String(f.get("page") || "").trim().slice(0, 40) || null, manual: true }; else delete p[key];
    S.editingPart = null; upsert({ ...v, parts: p }); render(); saveLibrary(vehicle());
  }
});

render();
initStorage();
})();
</script>
